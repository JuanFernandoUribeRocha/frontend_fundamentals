<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="d-flex flex-column fw-bold">
    <header
      class="row gx-0 bg-success d-flex justify-content-center align-items-center p-4 border border-3 border-white"
    >
      HEADER
    </header>

    <div class="row gx-0 vh-100">
      <aside
        class="col-xs-12 col-md-3 bg-danger d-flex justify-content-center align-items-center p-4 border border-3 border-white"
      >
        ASIDE
      </aside>

      <main class="col-xs-12 col-md-9">
        <section
          class="row gx-0 d-flex bg-info justify-content-center align-items-center p-4 border border-3 border-white"
          id="titulo"
        >
          TITULO
        </section>

        <div class="row g">
          <section
            class="col-xs-12 col-md-6 bg-warning gx-0 d-flex justify-content-center align-items-center p-4 border border-3 border-white"
            id="seccion1"
          >
            Sección 1
          </section>
          <section
            class="col-xs-12 col-md-6 bg-warning gx-0 d-flex justify-content-center align-items-center p-4 border border-3 border-white"
            id="seccion2"
          >
            Sección 2
          </section>
        </div>

        <section
          class="row row-cols-2 row-cols-lg-5 gx-0 flex-grow-1 vh-100"
          id="articulos"
        >
          <articles
            class="bg-primary -flex justify-content-center align-items-center border border-3 border-white"
          >
            ARTICLE 1
          </articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white"">ARTICLE 2</articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white">ARTICLE 3</articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white">ARTICLE 4</articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white">ARTICLE 5</articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white">ARTICLE 6</articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white">ARTICLE 7</articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white">ARTICLE 8</articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white">ARTICLE 9</articles>
          <articles class="bg-primary -flex justify-content-center align-items-center border border-3 border-white">ARTICLE 10</articles>
        </section>
      </main>
    </div>

    <footer class="row gx-0 bg-success d-flex justify-content-center align-items-center p-4 border border-3 border-white">FOOTER</footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
