<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @media (max-width: 360px) {
        div {
          color: red;
        }
      }

      @media (min-width: 560px) and (max-width: 700px) {
        div {
          color: blue;
        }
      }
    </style>
  </head>
  <body>
    <div>Texto de ejemplo, media queries</div>
  </body>
</html>
